name: Progress Dashboard

on:
  schedule:
    - cron: '30 10 * * 1-5'   # Mon–Fri 10:30 UTC = 16:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip writing dashboard.json and committing)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - name: Run dashboard pipeline
        run: node dist/features/progress-dashboard/src/index.js
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOG_LEVEL: info
      - name: Commit updated dashboard.json
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "em-bot"
          git config user.email "em-bot@users.noreply.github.com"
          git add features/progress-dashboard/frontend/public/dashboard.json
          git diff --cached --quiet || git commit -m "chore: update dashboard [skip ci]"
          git push
