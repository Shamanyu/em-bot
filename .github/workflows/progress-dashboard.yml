name: Progress Dashboard

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min — check which tenants are due to run
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Run for a specific tenant only (leave blank to run all due)'
        required: false
        type: string
      dry_run:
        description: 'Skip writing to Supabase'
        type: boolean
        default: true

jobs:
  find-tenants:
    name: Find tenants due to run
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.query.outputs.matrix }}
    steps:
      - name: Query Supabase for due tenants
        id: query
        run: |
          if [ -n "${{ inputs.tenant_id }}" ]; then
            MATRIX='["${{ inputs.tenant_id }}"]'
          else
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            MATRIX=$(curl -sf \
              "$SUPABASE_URL/rest/v1/tenant_config?select=tenant_id&next_run_at=lte.$NOW" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | jq -c '[.[].tenant_id]')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Tenants to run: $MATRIX"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  run-pipeline:
    name: Run pipeline for tenant ${{ matrix.tenant_id }}
    needs: find-tenants
    if: ${{ needs.find-tenants.outputs.matrix != '[]' && needs.find-tenants.outputs.matrix != '' }}
    strategy:
      matrix:
        tenant_id: ${{ fromJson(needs.find-tenants.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run dashboard pipeline
        run: node dist/features/progress-dashboard/src/index.js
        env:
          TENANT_ID: ${{ matrix.tenant_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOG_LEVEL: info
