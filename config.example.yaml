enabled: true

jira:
  filterId: TBD
  rollupTicketKey: TBD
  projectKeys: [PROJ1, PROJ2]
  apiVersion: "3"
  # Raw JQL fragment appended to every Epic query. Tune for your JIRA workflow.
  # Default (omit this field): statusCategory != Done
  # Examples:
  #   statusCategory = "In Progress"          — only actively worked Epics
  #   status in ("In Progress", "In Review")  — custom status names
  epicStatusJql: 'statusCategory != Done'

schedule:
  lookbackDays: 7

llm:
  model: "claude-sonnet-4-6"
  maxTokens: 2000
  maxRetries: 1

botIdentity:
  commentTag: "[EM-BOT-WEEKLY]"
  signature: "— EM Bot"

behaviour:
  skipIfAlreadyPosted: true
  postRollupEvenIfZeroEpics: false
  minRecommendations: 2
  maxRecommendations: 5
  maxEpicsPerRun: 20
